name: Smoke live (cadenas reales)

# Verifica semanalmente que las cadenas siguen respondiendo con el formato
# que esperan los adaptadores. Si una cae o cambia su API, abre/actualiza un
# issue para avisar antes que los usuarios lo noten.
#
# OJO: Unimarc, Tottus y Lider bloquean el tráfico de datacenter, así que
# desde los runners de GitHub (nube) es esperable que fallen. Este smoke es
# útil sobre todo para Jumbo y Santa Isabel (Constructor.io, sin bloqueo).
# Para una cobertura real de las cinco, córrelo en un runner self-hosted con
# IP residencial.

on:
  schedule:
    # Lunes 12:00 UTC (~08:00/09:00 en Chile según horario de verano).
    - cron: "0 12 * * 1"
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

jobs:
  smoke:
    name: Smoke contra sitios reales
    runs-on: ubuntu-latest
    permissions:
      issues: write # para abrir/comentar el issue de alerta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Ejecutar smoke live
        id: smoke
        run: npm run test:live
        continue-on-error: true

      - name: Abrir issue si el smoke falló
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ Smoke live falló: una o más cadenas no responden como se espera";
            const body = [
              "El smoke live programado falló. Puede ser un bloqueo antibot desde la nube",
              "(esperable para Unimarc/Tottus/Lider) o un cambio real de formato en alguna cadena.",
              "",
              `Corrida: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Si es un cambio de formato, hay que regrabar la fixture afectada en `tests/fixtures/` (anotando la fecha).",
            ].join("\n");
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "smoke-live",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number,
                body: `Volvió a fallar. ${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ["smoke-live"],
              });
            }
